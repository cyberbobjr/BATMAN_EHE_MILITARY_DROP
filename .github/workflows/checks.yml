name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Belt Walkie-Talkie (prérequis, require=\batman_BeltRadio) : récepteur réel des tests radio.
      - uses: actions/checkout@v4
        with:
          repository: cyberbobjr/BeltRadio
          path: _deps/BeltRadio

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install luacheck and lupa
        run: |
          sudo apt-get update
          sudo apt-get install -y lua-check
          python -m pip install lupa pillow

      # Sans le jeu, les tests qui lisent les tables vanilla sont ignorés.
      - name: Run checks
        run: python tests/run_tests.py --require-luacheck
        env:
          BELT_RADIO_LUA: _deps/BeltRadio/Contents/mods/batman_BeltRadio/42.21/media/lua

      - name: Check Mayday models and textures
        run: python tests/check_mayday_assets.py
